[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthoswift-plugin-metashape"
version = "1.0.0"
description = "OrthoSWIFT plugin for Agisoft Metashape Professional"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OrthoSWIFT", email = "info@orthoswift.net"}
]
keywords = ["orthoswift", "metashape", "agisoft", "photogrammetry", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3.0",
    "geopandas>=0.13.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "shapely>=2.0.0",
    "scipy>=1.9.0",
    "reportlab>=4.0.0",
    "scikit-learn>=1.3.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://orthoswift.net"
Repository = "https://github.com/Nyasha-Shekede/orthoswift-plugin-webodm"
Issues = "https://github.com/Nyasha-Shekede/orthoswift-plugin-webodm/issues"

[tool.setuptools]
packages = ["orthoswift", "orthoswift.core"]

[tool.setuptools.package-data]
orthoswift = ["requirements.txt", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
