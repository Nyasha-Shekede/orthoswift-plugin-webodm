name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orthoswift-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orthoswift/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orthoswift/requirements.txt pytest ruff bandit

      - name: Run test suite
        run: python -m pytest -q

      - name: Run lint and security audits
        run: |
          python -m ruff check orthoswift tests build_release.py --select E9,F,I
          python -m bandit -q -r orthoswift -x tests -lll

      - name: Extract and validate version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import runpy; print(runpy.run_path('orthoswift/version.py')['__version__'])")
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('orthoswift/manifest.json'))['version'])")
          test "$VERSION" = "$MANIFEST_VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected plugin version: $VERSION"

      - name: Package WebODM plugin release ZIP
        run: python build_release.py

      - name: Verify checksums
        run: |
          cd dist
          sha256sum --check *.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orthoswift-webodm-plugin-v${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish immutable GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          TITLE="OrthoSWIFT WebODM Plugin $TAG"
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "$TITLE" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
