name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orthoswift/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orthoswift/requirements.txt pytest ruff bandit

      - name: Run Test Suite
        run: python -m pytest -q

      - name: Run Lint and Security Audits
        run: |
          python -m ruff check orthoswift tests --select E9,F
          python -m bandit -q -r orthoswift -x tests -lll

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(python -c "import runpy; g=runpy.run_path('orthoswift/version.py'); print(g.get('__version__', '1.0.0'))")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected plugin version: $VERSION"

      - name: Package WebODM Plugin Release ZIP
        run: |
          python build_release.py
          ZIP_NAME="orthoswift-webodm-plugin-v${{ steps.get_version.outputs.VERSION }}.zip"
          echo "ZIP_FILE=dist/$ZIP_NAME" >> $GITHUB_ENV
          echo "SHA_FILE=dist/$ZIP_NAME.sha256" >> $GITHUB_ENV

      - name: Verify Checksums
        run: |
          cd dist
          sha256sum --check *.sha256

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orthoswift-webodm-plugin-v${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v${{ steps.get_version.outputs.VERSION }}"
          fi
          TITLE="OrthoSWIFT WebODM Plugin v${{ steps.get_version.outputs.VERSION }}"
          echo "Publishing release for tag $TAG_NAME with files:"
          ls -la dist/

          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" dist/*.zip dist/*.sha256 \
              --title "$TITLE" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$TAG_NAME" dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          fi
