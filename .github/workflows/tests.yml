name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: orthoswift/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r orthoswift/requirements.txt pytest ruff bandit
      - run: python -m pytest -q
      - run: python -m ruff check orthoswift tests build_release.py --select E9,F,I
      - run: python -m bandit -q -r orthoswift -x tests -lll
